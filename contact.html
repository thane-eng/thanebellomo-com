<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Thane Bellomo</title>
  <meta name="description" content="Start a conversation with Thane Bellomo about executive coaching and building a Courage Economy." />
  <link rel="canonical" href="https://thanebellomo.com/contact" />
  <meta name="theme-color" content="#0a1f3d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0a1f3d; --paper:#e8e4dc; --paper-dim:#b8b4ac; --gold:#c9a052; --ink:#071422; --muted:#8f8a80; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:var(--navy); color:var(--paper); }
    .wrap { max-width:720px; margin:0 auto; padding:28px 22px 72px; }
    header { display:flex; justify-content:space-between; align-items:center; }
    .brand { font-family:"Playfair Display",Georgia,serif; text-decoration:none; color:var(--paper); }
    nav a { color:#b8b4ac; text-decoration:none; margin-left:16px; font-size:.9rem; }
    h1 { font-family:"Playfair Display",Georgia,serif; font-size:clamp(2rem,5vw,3.2rem); letter-spacing:-.03em; margin:48px 0 0; }
    .rule { width:56px; height:2px; background:var(--gold); margin:22px 0; }
    p { color:var(--paper-dim); font-size:1.05rem; max-width:36rem; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
    .btn { display:inline-flex; align-items:center; min-height:44px; padding:0 16px; text-decoration:none; border-radius:2px; font-weight:600; }
    .gold { background:var(--gold); color:var(--ink); }
    .outline { border:1px solid color-mix(in srgb,var(--paper) 22%,transparent); color:var(--paper); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/">Thane Bellomo</a>
      <nav>
        <a href="https://thecourageeconomy.net">Courage Economy</a>
        <a href="/contact">Contact</a>
      </nav>
    </header>
    <h1>If the diagnostic named something you cannot unsee, this is the next conversation.</h1>
    <div class="rule"></div>
    <p>Executive coaching and organizational work for leaders who are done buying harmony with comfortable lies.</p>
    <div class="actions">
      <a class="btn gold" href="https://calendly.com/thanebellomo" target="_blank" rel="noreferrer">Book a call</a>
      <a class="btn outline" href="https://thecourageeconomy.net/work">The work</a>
    </div>
  </div>
</body>
</html>
